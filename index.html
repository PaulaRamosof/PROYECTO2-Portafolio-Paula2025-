<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alphabet Flip Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Modal de introducción en pantalla completa -->
  <div id="introModal" class="modal fade" tabindex="-1" inert aria-labelledby="introModalLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-dark text-white border-0 rounded-0 p-0 position-relative">
        <div class="ratio ratio-16x9">
          <video id="introVideo" muted playsinline autoplay>
            <source src="img/video/alphabet.mp4" type="video/mp4" />
            Tu navegador no soporta el video HTML5.
          </video>
        </div>
        <div class="position-absolute bottom-0 start-50 translate-middle-x mb-5">
          <button id="startButton" class="btn btn-lg btn-warning px-5">🚀 Comenzar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Encabezado -->
  <header class="main-header text-center py-4">
    <h1 id="introModalLabel">🌈 Aprende el Alfabeto Jugando</h1>
    <p class="lead">Haz clic en cada letra para descubrir una imagen y practicar su pronunciación</p>
  </header>

  <!-- Contenedor principal de cartas -->
  <main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="card-container" id="cardContainer">
      <!-- Las cartas se generan dinámicamente con JS -->
    </div>
  </main>

  <!-- Modal de vista previa -->
  <div id="previewModal" class="modal fade" tabindex="-1" aria-labelledby="previewModalLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content p-4 text-center position-relative">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        <div id="previewContent" aria-labelledby="previewModalLabel">
          <!-- Contenido dinámico generado por JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-primary text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2025 Learn the Alphabet. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
